<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuru Connect - SHARED</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f0f0f;color:white}.header{background:linear-gradient(135deg,#f59e0b,#ef4444);padding:20px;text-align:center;position:sticky;top:0;z-index:20}.container{max-width:440px;margin:0 auto;padding:14px}.card{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:16px;padding:16px;margin-bottom:12px}.leader-card{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid #f59e0b55}.avatar{width:52px;height:52px;background:#f59e0b;border-radius:50%;display:flex;align-items:center;justify-content:center;color:black;font-weight:900;font-size:22px}.badge{background:#22c55e22;color:#22c55e;padding:3px 8px;border-radius:20px;font-size:10px}h2{font-size:14px;color:#fbbf24;margin-bottom:10px}input,textarea{width:100%;background:#111;border:1px solid #333;color:white;padding:13px;border-radius:12px;margin-bottom:10px}textarea{min-height:85px}.btn{width:100%;background:#f59e0b;color:black;border:none;padding:14px;border-radius:12px;font-weight:900;cursor:pointer}.btn2{width:100%;background:#252525;border:1px solid #333;color:white;padding:12px;border-radius:12px;margin-top:8px;cursor:pointer;font-size:13px}.loginBtn{background:#f59e0b;color:black;border:none;padding:10px 16px;border-radius:10px;font-weight:900}.member{background:#252525;padding:11px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}.actions{display:flex;gap:5px}.act{background:#111;border:1px solid #333;color:white;padding:6px 9px;border-radius:8px;font-size:11px;cursor:pointer}.act.ok{background:#22c55e;color:black;font-weight:800}.tabs{display:flex;gap:6px;margin-bottom:10px}.tab{flex:1;background:#111;border:1px solid #333;padding:10px;border-radius:10px;text-align:center;font-size:11px;cursor:pointer}.tab.on{background:#f59e0b;color:black;font-weight:900}.verse{background:linear-gradient(135deg,#1c1c1c,#1a1600);border:1px solid #f59e0b33}.vtxt{font-style:italic}.vref{color:#f59e0b;font-weight:800;margin-top:6px}.hidden{display:none}</style></head><body><div class="header"><h1>NURU CONNECT</h1><p style="font-size:11px">SHARED LIVE • 0116782556 • <span id="status">Connecting...</span></p></div><div class="container"><div id="youthView"><div class="card leader-card"><div class="avatar">L</div><div style="flex:1"><b style="color:#fbbf24">Youth Leader</b><br><small>0116782556</small><br><span class="badge">● Shared DB 11e40483</span></div><button class="loginBtn" onclick="openOffice()">LOGIN</button></div><div class="card verse"><h2>📖 Verse Today - <span id="vDate"></span></h2><p class="vtxt" id="vText"></p><p class="vref" id="vRef"></p><button class="btn2" onclick="shareVerse()">📲 Share Verse</button></div><div class="card"><h2>📢 Guidance (ALL phones see same)</h2><div id="gList">Loading shared guidance...</div></div><div class="card"><h2>Join Nuru Youth</h2><input id="yName" placeholder="Full Name"><input id="yPhone" placeholder="07..."><button class="btn" onclick="requestJoin()">REQUEST TO JOIN</button></div></div><div id="officeView" class="hidden"><div class="card"><h2>🔐 LEADER OFFICE - SHARED</h2><div id="pinBox"><input type="password" id="pin" placeholder="PIN 2556"><button class="btn" onclick="unlock()">UNLOCK</button></div><div id="officeContent" class="hidden"><div class="tabs"><div class="tab on" id="tP" onclick="tab('P')">Pending (<span id="cP">0</span>)</div><div class="tab" id="tM" onclick="tab('M')">Members (<span id="cM">0</span>)</div><div class="tab" id="tB" onclick="tab('B')">Broadcast</div></div><div id="tabP"><div id="pList"></div></div><div id="tabM" class="hidden"><input id="search" placeholder="Search..." oninput="drawMembers()"><div id="mList"></div></div><div id="tabB" class="hidden"><textarea id="bText" placeholder="Type guidance ALL will see..."></textarea><button class="btn" onclick="postGuid()">POST - ALL PHONES SEE NOW</button><button class="btn2" onclick="broadWA()">📲 Also Broadcast via WhatsApp</button></div></div><button class="btn2" onclick="closeOffice()">← Back</button></div></div></div><script>
const LEADER="254116782556";const BIN_ID="11e40483";const BIN_URL="https://api.npoint.io/"+BIN_ID;
const verses=[{v:"Let no one despise you for your youth, but set the believers an example.",r:"1 Timothy 4:12"},{v:"For I know the plans I have for you, declares the Lord.",r:"Jeremiah 29:11"},{v:"Trust in the Lord with all your heart.",r:"Proverbs 3:5"},{v:"I can do all things through him who strengthens me.",r:"Philippians 4:13"},{v:"Be strong and courageous.",r:"Joshua 1:9"},{v:"Your word is a lamp to my feet.",r:"Psalm 119:105"},{v:"Arise, shine, for your light has come.",r:"Isaiah 60:1 - NURU"}];
let di=new Date().getDate()%verses.length;let td=verses[di];document.getElementById('vText').innerText='"'+td.v+'"';document.getElementById('vRef').innerText='- '+td.r;document.getElementById('vDate').innerText=new Date().toLocaleDateString('en-KE',{weekday:'short',day:'numeric',month:'short'});
let pending=[],members=[],guides=[];
async function loadShared(){try{let r=await fetch(BIN_URL);let j=await r.json();pending=j.pending||[];members=j.members||[];guides=j.guides||[];document.getElementById('status').innerText='Shared Live ✓';updateCounts();drawAll();}catch(e){document.getElementById('status').innerText='Connecting... check ID';}}
async function saveShared(){document.getElementById('status').innerText='Saving...';try{await fetch(BIN_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pending,members,guides})});document.getElementById('status').innerText='Shared Live ✓';}catch(e){document.getElementById('status').innerText='Save failed';}updateCounts();drawAll();}
function requestJoin(){let n=document.getElementById('yName').value.trim();let p=document.getElementById('yPhone').value.trim();if(!n||!p){alert('Enter name and phone');return;}pending.push({id:Date.now(),name:n,phone:p,date:new Date().toLocaleString('en-KE')});saveShared();alert('Sent to SHARED DB!');window.location.href="https://wa.me/"+LEADER+"?text="+encodeURIComponent(`Shalom Leader! I'm ${n} ${p} joined Nuru`);}
function updateCounts(){document.getElementById('cP').innerText=pending.length;document.getElementById('cM').innerText=members.length;}
function drawAll(){drawPending();drawMembers();drawGuides();}
function drawPending(){let d=document.getElementById('pList');if(!pending.length){d.innerHTML='<p style="color:#666;font-size:12px">No pending</p>';return;}d.innerHTML='';pending.forEach(m=>{d.innerHTML+=`<div class="member"><div><b>${m.name}</b><br><small>${m.phone}</small></div><div class="actions"><button class="act ok" onclick="accept(${m.id})">ACCEPT</button><button class="act" onclick="chatOne('${m.phone}','${m.name}')">Chat</button></div></div>`});}
function drawMembers(){let d=document.getElementById('mList');let q=(document.getElementById('search')?.value||'').toLowerCase();let list=members.filter(m=>m.name.toLowerCase().includes(q)||m.phone.includes(q));if(!list.length){d.innerHTML='<p style="color:#666;font-size:12px">No members</p>';return;}d.innerHTML='';list.forEach(m=>{d.innerHTML+=`<div class="member"><div><b>${m.name}</b><br><small>${m.phone}</small></div><div class="actions"><button class="act ok" onclick="chatOne('${m.phone}','${m.name}')">💬 Chat 1-on-1</button></div></div>`});}
function drawGuides(){let d=document.getElementById('gList');if(!guides.length){d.innerHTML='<p style="color:#666;font-size:12px">No guidance yet</p>';return;}d.innerHTML='';guides.slice().reverse().forEach(g=>{d.innerHTML+=`<div style="background:#252525;border-left:3px solid #f59e0b;padding:10px;border-radius:8px;margin-bottom:8px"><small style="color:#fbbf24">${g.date}</small><p style="font-size:13px;margin-top:4px">${g.text}</p></div>`});}
function accept(id){let i=pending.findIndex(x=>x.id==id);if(i<0)return;let m=pending[i];members.push(m);pending.splice(i,1);saveShared();}
function chatOne(phone,name){let c=phone.replace(/\D/g,'');if(c.startsWith('0'))c='254'+c.slice(1);window.location.href="https://wa.me/"+c+"?text="+encodeURIComponent(`Shalom ${name}! Leader Nuru - accepted!`);}
function postGuid(){let t=document.getElementById('bText').value.trim();if(!t){alert('Type guidance');return;}guides.push({text:t,date:new Date().toLocaleString('en-KE')});document.getElementById('bText').value='';saveShared();alert('POSTED! Every phone sees it now!');}
function broadWA(){let t=document.getElementById('bText').value.trim()||(guides.length?guides[guides.length-1].text:'');if(!t){alert('Type');return;}window.location.href="https://wa.me/?text="+encodeURIComponent(`📢 NURU GUIDANCE - 0116782556\n\n${t}\n\nnuru-connect.onrender.com`);}
function broadVerse(){window.location.href="https://wa.me/?text="+encodeURIComponent(`📖 Nuru Verse - ${document.getElementById('vDate').innerText}\n\n"${td.v}"\n${td.r}`);}
function shareVerse(){broadVerse();}
function openOffice(){document.getElementById('youthView').classList.add('hidden');document.getElementById('officeView').classList.remove('hidden');}
function closeOffice(){document.getElementById('officeView').classList.add('hidden');document.getElementById('youthView').classList.remove('hidden');}
function unlock(){if(document.getElementById('pin').value!=='2556'){alert('Wrong PIN');return;}document.getElementById('pinBox').classList.add('hidden');document.getElementById('officeContent').classList.remove('hidden');drawAll();}
function tab(w){document.getElementById('tabP').classList.add('hidden');document.getElementById('tabM').classList.add('hidden');document.getElementById('tabB').classList.add('hidden');document.getElementById('tP').classList.remove('on');document.getElementById('tM').classList.remove('on');document.getElementById('tB').classList.remove('on');if(w=='P'){document.getElementById('tabP').classList.remove('hidden');document.getElementById('tP').classList.add('on');}if(w=='M'){document.getElementById('tabM').classList.remove('hidden');document.getElementById('tM').classList.add('on');}if(w=='B'){document.getElementById('tabB').classList.remove('hidden');document.getElementById('tB').classList.add('on');}}
loadShared();
</script></body></html>
