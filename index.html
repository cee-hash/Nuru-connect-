.note{background:#252525;border-left:3px solid #f59e0b;padding:12px;border-radius:8px;margin-bottom:10px}
.note b{color:#fbbf24;font-size:11px}
.note p{font-size:13px;color:#ddd;margin-top:4px;line-height:1.4}
.verse-card{background:linear-gradient(135deg,#1c1c1c,#1a1600);border:1px solid #f59e0b33}
.verse-text{font-size:15px;line-height:1.6;color:#eee;font-style:italic}
.verse-ref{color:#f59e0b;margin-top:8px;font-weight:700;font-size:13px}
.admin{border:1px dashed #f59e0b;background:#1a1600}
.hidden{display:none}

</div>
